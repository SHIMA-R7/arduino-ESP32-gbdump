[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3

# Classic ESP32 DevKitC. Reaches a reliable identify with the pin/timing
# branches in joybus.cpp and main.cpp, but was never carried through to a
# verified cartridge dump -- the C6 is the tested target.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
